<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#080a0f" />
  <title>Classroom of the Elite | Boteco RWX</title>
  <meta name="description" content="Web presentation do Boteco RWX para a live de Classroom of the Elite." />
  <style>
    /* Critical live-safe navigation: never show a horizontal scrollbar. */
    #partTabs{
      display:grid !important;
      grid-template-columns:repeat(7,minmax(0,1fr)) !important;
      gap:8px !important;
      width:100% !important;
      max-width:100% !important;
      overflow:hidden !important;
      padding:0 0 20px !important;
      scrollbar-width:none !important;
    }
    #partTabs::-webkit-scrollbar{display:none !important}
    #partTabs .part-tab{
      min-width:0 !important;
      width:100% !important;
      max-width:100% !important;
      white-space:nowrap !important;
      overflow:hidden !important;
      text-overflow:clip !important;
      padding:11px 5px !important;
      font-size:13px !important;
      text-align:center !important;
    }
    @media(max-width:980px){
      #partTabs{grid-template-columns:repeat(4,minmax(0,1fr)) !important}
    }
    @media(max-width:760px){
      #partTabs{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
    }
  </style>
  <script>
    /*
      raw.githack caches branch assets aggressively.
      This page therefore fetches the current MAIN files straight from raw.githubusercontent.com
      on every reload, using no-store + a timestamp.
    */
    window.__RWX_FRESH__ = Date.now();
  </script>
</head>
<body>
  <header class="hero">
    <div class="hero-art" aria-hidden="true">
      <img id="heroPoster" src="https://you-zitsu.com/2nd/assets/news/vis-h1.jpg" alt="" referrerpolicy="no-referrer" />
      <div class="hero-art-shade"></div>
    </div>
    <div class="hero-noise"></div>
    <div class="hero-inner">
      <div class="brandline">
        <span class="rwx-badge">RWX</span>
        <span>BOTECO RWX APRESENTA</span>
      </div>
      <p class="hero-kicker">Temporadas 1 + 2</p>
      <h1>CLASSROOM<br><span>OF THE ELITE</span></h1>
      <p class="hero-lead">
        Uma escola criada para medir seus alunos. E, no centro dela, um garoto que passou a vida inteira sendo medido.
      </p>
    </div>
  </header>

  <main class="site-shell">
    <nav id="partTabs" class="part-tabs" aria-label="Partes da apresentação"></nav>
    <section id="partView" class="part-view" aria-live="polite"></section>

    <div class="part-nav">
      <button id="prevPart" type="button">← Parte anterior</button>
      <span id="partCounter"></span>
      <button id="nextPart" type="button">Próxima parte →</button>
    </div>
  </main>

  <footer class="footer">
    <span>Boteco RWX</span>
    <span>game · anime · música · confusão</span>
  </footer>
  <script>
    (async () => {
      const fresh = window.__RWX_FRESH__ || Date.now();
      const base = "https://raw.githubusercontent.com/fezupo/ClassroomRWX/main/";

      async function get(name){
        const response = await fetch(base + name + "?fresh=" + fresh, {
          cache: "no-store",
          mode: "cors"
        });
        if(!response.ok) throw new Error(name + " HTTP " + response.status);
        return response.text();
      }

      try {
        const cssText = await get("styles.css");
        const style = document.createElement("style");
        style.setAttribute("data-rwx-main", "styles.css");
        style.textContent = cssText;
        document.head.appendChild(style);

        const clipsText = await get("clips.js");
        const clipsScript = document.createElement("script");
        clipsScript.setAttribute("data-rwx-main", "clips.js");
        clipsScript.textContent = clipsText;
        document.body.appendChild(clipsScript);

        const appText = await get("app.js");
        const appScript = document.createElement("script");
        appScript.setAttribute("data-rwx-main", "app.js");
        appScript.textContent = appText;
        document.body.appendChild(appScript);
      } catch(err) {
        console.error("RWX MAIN loader error:", err);
        const msg = document.createElement("div");
        msg.style.cssText = "padding:18px;color:#fff;background:#7a1426;font:700 14px system-ui";
        msg.textContent = "Falha ao ler o MAIN atualizado. Recarregue a página.";
        document.body.prepend(msg);
      }
    })();
  </script>
</body>
</html>
