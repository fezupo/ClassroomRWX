<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#080a0f" />
  <title>Classroom of the Elite | Boteco RWX</title>
  <meta name="description" content="Web presentation do Boteco RWX para a live de Classroom of the Elite." />
  <script>
    (() => {
      const fresh = Date.now();
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "styles.css?fresh=" + fresh;
      document.head.appendChild(css);
      window.__RWX_FRESH__ = fresh;
    })();
  </script>
</head>
<body>
  <header class="hero">
    <div class="hero-art" aria-hidden="true">
      <img id="heroPoster" src="https://you-zitsu.com/1st/assets/news/vis-t1.jpg" alt="" referrerpolicy="no-referrer" />
      <div class="hero-art-shade"></div>
    </div>
    <div class="hero-noise"></div>
    <div class="hero-inner">
      <div class="brandline">
        <span class="rwx-badge">RWX</span>
        <span>BOTECO RWX APRESENTA</span>
      </div>
      <p class="hero-kicker">Temporadas 1 + 2</p>
      <h1>CLASSROOM<br><span>OF THE ELITE</span></h1>
      <p class="hero-lead">
        Uma escola criada para medir seus alunos. E, no centro dela, um garoto que passou a vida inteira sendo medido.
      </p>
    </div>
  </header>

  <main class="site-shell">
    <nav id="partTabs" class="part-tabs" aria-label="Partes da apresentação"></nav>
    <section id="partView" class="part-view" aria-live="polite"></section>

    <div class="part-nav">
      <button id="prevPart" type="button">← Parte anterior</button>
      <span id="partCounter"></span>
      <button id="nextPart" type="button">Próxima parte →</button>
    </div>
  </main>

  <footer class="footer">
    <span>Boteco RWX</span>
    <span>game · anime · música · confusão</span>
  </footer>
  <script>
    (() => {
      const fresh = window.__RWX_FRESH__ || Date.now();

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src + "?fresh=" + fresh;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }

      loadScript("clips.js")
        .then(() => loadScript("app.js"))
        .catch(err => {
          console.error("RWX loader error:", err);
          const msg = document.createElement("div");
          msg.style.cssText = "padding:18px;color:#fff;background:#7a1426;font:700 14px system-ui";
          msg.textContent = "Falha ao carregar os arquivos atualizados. Recarregue a página.";
          document.body.prepend(msg);
        });
    })();
  </script>
</body>
</html>
