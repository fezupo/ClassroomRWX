<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom of the Elite | Boteco RWX</title>
  <meta name="description" content="Web presentation do Boteco RWX para a live de Classroom of the Elite, temporadas 1 e 2." />
  <link rel="preconnect" href="https://www.youtube-nocookie.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">RWX</span>
        <div>
          <strong>BOTECO RWX</strong>
          <small>Classroom of the Elite · T1 + T2</small>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="notesToggle" class="icon-btn" type="button" title="Notas da bancada (N)">N</button>
        <button id="fullscreenBtn" class="icon-btn" type="button" title="Tela cheia (F)">⛶</button>
      </div>
    </header>

    <main class="presentation-shell">
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>

      <section id="slide" class="slide" aria-live="polite"></section>

      <nav class="controls" aria-label="Navegação da apresentação">
        <button id="prevBtn" type="button">← Anterior</button>
        <div class="counter">
          <span id="slideNumber">1</span>
          <span class="counter-sep">/</span>
          <span id="slideTotal">1</span>
        </div>
        <button id="nextBtn" type="button">Próximo →</button>
      </nav>
    </main>
  </div>

  <dialog id="videoDialog" class="video-dialog">
    <div class="video-dialog-head">
      <div>
        <small id="videoKicker"></small>
        <strong id="videoTitle"></strong>
      </div>
      <button id="closeVideo" class="icon-btn" type="button" aria-label="Fechar">✕</button>
    </div>
    <div id="videoFrameHost" class="video-frame-host"></div>
  </dialog>

  <script src="clips.js"></script>
  <script src="app.js"></script>
</body>
</html>
